<h1 class="content__h1">Variables</h1>
<p class="content__p">
    Variables can be assigned with or without types.
</p>
<pre class="content__code">
// without type
a = 10

// with type
i8 a = 11
</pre>
<p class="content__p">
    Variables are mutable by default but can be declared immutable with
    the const keyword.
</p>
<pre class="content__code">
const a = 10
const i8 a = 10
</pre>
